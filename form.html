<!DOCTYPE HTML>
<html lang="id">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device=width, initial-scele=1.0">
		<title>printKu - Order</title>
		
		<link rel="stylesheet" href="style_section.css">
		<link rel="stylesheet" href="style_form.css">
	</head>	
	<body>
		
		<!--=================
			header websiete
		=====================-->
		
		<header>
			<div class="logo">
				<h1>PrintKu</h1>
				<p>Cetak apa saja,Kualitas Juara!</p>
			</div>
		</header>
		
		<!--=================
			Menu navigasi
		=====================-->
		
		<nav>
			<ul>
				<li>
					<a href="index.html">Beranda</a>
				</li>
				<li>
					<a href="form.html">order</a>
				</li>
				<li>
					<a href="evaluation.html">evaluation</a>
				</li>
				<li>
					<a href="About_us.html">About us</a>
				</li>
			</ul>		
		</nav>
		<div class="container">
			<main>
				<section>
					<h2>Formulir Pemesanan Cetak</h2>
					<p>Atur pesanan anda disini. Harga akan otomatis terhitung</p>
				</section>

				<div>
					<strong>Pesanan Diterima!</strong>
					Silahkan cek email Anda untuk intruksi pembayaran.
				</div>

				<form>
					<div>
						<label>Nama pelanggan:</label>
						<input type="text" id="custName" name="custName" placeholder="Masukkan nama Anda">
						<span id="errName" class="error-msg"></span>
					</div>

					<div>
						<label>Nomor Telepon:</label>
						<input type="text" id="NoTel" name="NoTel" placeholder="Masukkan nomor Anda">
						<span id="errNoTel" class="error-msg"></span>
					</div>

					<div>
						<label>Email:</label>
						<input type="text" id="Email" placeholder="email@example.com">
						<span id="errEmail" class="error-msg"></span>
					</div>

					<div>
						<label>Jenis Cetakan:</label>
						<select name="jenisCetak" id="jenisCetak">
							<option value="">Pilih Jenis</option>
							<option value="5000">Stiker (Rp 5.000/pcs)</option>
							<option value="20000">Banner (Rp 20.000/pcs)</option>
							<option value="10000">Poster (Rp 10.000/pcs)</option>
							<option value="25000">Kartu Nama (Rp 25.000/pcs)</option>
							<option value="15000">Laminasi Khusus (Rp 15.000/lembar)</option>
						</select>
						<span id="errJenis" class="error-msg"></span>
					</div>

					<div>
						<label>Ukuran Cetakan:</label>
						<select name="ukurancetak" id="ukuranCetak">
							<option value="">Pilih Ukuran</option>
							<option value="1">3x3 cm (Harga Normal)</option>
							<option value="2">A4 (2x Harga Normal)</option>
							<option value="3">A3 (3x Harga Normal)</option>
							<option value="5">1 Meter (5x Harga Normal)</option>
							<option value="1.5">Custom (1.5x Harga Normal)</option>
						</select>
						<span id="errUkuran" class="error-msg"></span>
					</div>

					<div>
						<label for="">Jumlah Pesanan:</label>
						<input type="text" id="jumlah" name="jumlah" placeholder="Contoh: 50">
						<span id="errJumlah" class="error-msg"></span>
					</div>

					<div>
						<label for="">Upload Desain Anda (.jpg, .png, .pdf):</label>
						<input type="file" id="File" name="File">
						<span id="errFile" class="error-msg"></span>
					</div>

					<div>
						<label for="">Catatan Tambahan:</label>
						<textarea name="catatan" id="catatan" rows="4" placeholder=""></textarea>
					</div>

					<div>
						<h3>Total Harga:</h3>
						<div class="total-harga" id="tampilHarga">Rp 0</div>
					</div>

					<button type="submit">Pesan Sekarang</button>
				</form>
			</main>
		</div>

	</body>
</html>
